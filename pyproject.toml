[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-research"
version = "0.1.0"
description = "Pesquisa exploratoria de perfis de resolucao de exercicios no CodeBench."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "jupyterlab",
]

[tool.setuptools.packages.find]
include = ["clustering_research*"]
